
<!DOCTYPE html>
<html>
<head>
    <title>Contact - Chai Junction</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>☕ Chai Junction</h1>
        <p>Fresh Chai & Snacks</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
    </nav>

    <section>
        <h2>Contact Us</h2>

        <p>We would love to hear from you!</p>

        <h3>Our Information</h3>

        <p>Address: Islamabad, Pakistan</p>
        <p>Phone: 0300-1234567</p>
        <p>Email: chaijunction@example.com</p>

        <h3>Send Us a Message</h3>

        <form onsubmit="sendMessage(event)">

            <label>Your Name:</label><br>
            <input type="text" required><br><br>

            <label>Your Email:</label><br>
            <input type="email" required><br><br>

            <label>Your Message:</label><br>
            <textarea required></textarea><br><br>

            <button type="submit">Send Message</button>

        </form>
    </section>

    <footer>
        <p>Thank you for visiting Chai Junction!</p>
    </footer>

    <script>
        function sendMessage(event) {
            event.preventDefault();
            window.alert("Thank you for contacting Chai Junction!");
        }
    </script>

</body>
</html>
